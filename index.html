<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>NOVA OS</title>

<style>
*{
  box-sizing:border-box;
  user-select:none;
}

:root{
  --accent:#7c6cff;
  --accent2:#5ad7ff;
  --bg:#080a0f;
  --panel:rgba(18,21,30,.88);
  --panel2:#11141c;
  --border:rgba(255,255,255,.1);
  --text:#f4f6fb;
  --muted:#9299aa;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,"Noto Sans KR",sans-serif;
  background:#080a0f;
  color:var(--text);
}

button,input,textarea{
  font:inherit;
}

button{
  color:inherit;
  cursor:pointer;
}

/* DESKTOP */

#desktop{
  position:fixed;
  inset:0;
  overflow:hidden;
  background:
    radial-gradient(circle at 20% 10%,rgba(124,108,255,.28),transparent 35%),
    radial-gradient(circle at 90% 80%,rgba(90,215,255,.13),transparent 30%),
    linear-gradient(135deg,#080a10,#0b0d15 50%,#090b11);
  transition:.5s;
}

#desktop.wallpaper2{
  background:
    radial-gradient(circle at 80% 20%,rgba(255,70,130,.2),transparent 30%),
    radial-gradient(circle at 10% 90%,rgba(120,70,255,.2),transparent 35%),
    linear-gradient(135deg,#120912,#080a14);
}

#desktop.wallpaper3{
  background:
    radial-gradient(circle at 50% 30%,rgba(0,220,255,.2),transparent 30%),
    radial-gradient(circle at 10% 10%,rgba(0,120,255,.18),transparent 30%),
    linear-gradient(135deg,#031018,#060b14);
}

#desktop.wallpaper4{
  background:
    radial-gradient(circle at 50% 50%,rgba(255,180,70,.16),transparent 30%),
    linear-gradient(135deg,#17100a,#080a0e);
}

/* DESKTOP ICONS */

.desktop-icons{
  position:absolute;
  top:22px;
  left:22px;
  display:grid;
  grid-template-columns:repeat(2,90px);
  gap:18px 12px;
}

.desktop-icon{
  width:90px;
  min-height:82px;
  padding:8px 4px;
  border:1px solid transparent;
  border-radius:10px;
  text-align:center;
  background:transparent;
}

.desktop-icon:hover{
  background:rgba(255,255,255,.08);
  border-color:rgba(255,255,255,.08);
}

.icon-box{
  width:44px;
  height:44px;
  margin:auto;
  display:grid;
  place-items:center;
  border-radius:12px;
  background:linear-gradient(145deg,rgba(124,108,255,.25),rgba(90,215,255,.08));
  border:1px solid rgba(255,255,255,.1);
  font-size:12px;
  font-weight:900;
}

.desktop-icon span{
  display:block;
  margin-top:8px;
  font-size:11px;
  color:#dce0e9;
}

/* TASKBAR */

.taskbar{
  position:absolute;
  left:12px;
  right:12px;
  bottom:12px;
  height:58px;
  display:flex;
  align-items:center;
  gap:8px;
  padding:8px;
  border:1px solid rgba(255,255,255,.1);
  border-radius:16px;
  background:rgba(12,14,20,.82);
  backdrop-filter:blur(20px);
  box-shadow:0 15px 50px rgba(0,0,0,.4);
  z-index:9000;
}

.start-button{
  width:43px;
  height:43px;
  border:1px solid rgba(255,255,255,.08);
  border-radius:11px;
  background:rgba(255,255,255,.06);
  display:grid;
  place-items:center;
  font-weight:900;
  color:#aaa2ff;
}

.start-button:hover{
  background:rgba(124,108,255,.18);
}

.task-apps{
  display:flex;
  gap:6px;
  flex:1;
  min-width:0;
}

.task-app{
  width:40px;
  height:40px;
  border:1px solid transparent;
  border-radius:10px;
  background:transparent;
  display:grid;
  place-items:center;
  font-size:11px;
}

.task-app:hover,
.task-app.active{
  background:rgba(255,255,255,.08);
  border-color:var(--border);
}

.clock{
  min-width:85px;
  padding:0 9px;
  text-align:center;
  font-size:11px;
  color:#cbd0db;
}

/* START MENU */

.start-menu{
  position:absolute;
  left:12px;
  bottom:82px;
  width:340px;
  max-width:calc(100vw - 24px);
  padding:15px;
  border:1px solid rgba(255,255,255,.1);
  border-radius:17px;
  background:rgba(14,17,24,.94);
  backdrop-filter:blur(25px);
  box-shadow:0 25px 80px rgba(0,0,0,.55);
  z-index:9500;
  display:none;
}

.start-menu.open{
  display:block;
  animation:menuIn .16s ease;
}

@keyframes menuIn{
  from{transform:translateY(8px);opacity:0}
  to{transform:translateY(0);opacity:1}
}

.start-top{
  display:flex;
  align-items:center;
  gap:10px;
  padding:7px 5px 16px;
}

.user-avatar{
  width:35px;
  height:35px;
  display:grid;
  place-items:center;
  border-radius:50%;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:white;
  font-size:11px;
  font-weight:bold;
}

.start-title{
  font-size:13px;
  font-weight:bold;
}

.start-sub{
  margin-top:3px;
  color:var(--muted);
  font-size:10px;
}

.app-list{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
}

.start-app{
  display:flex;
  align-items:center;
  gap:10px;
  padding:11px;
  border:1px solid transparent;
  border-radius:10px;
  background:rgba(255,255,255,.035);
  text-align:left;
}

.start-app:hover{
  background:rgba(124,108,255,.12);
  border-color:rgba(124,108,255,.2);
}

.start-app-icon{
  width:31px;
  height:31px;
  display:grid;
  place-items:center;
  border-radius:8px;
  background:rgba(255,255,255,.07);
  font-size:9px;
  font-weight:bold;
}

.start-app b{
  display:block;
  font-size:11px;
}

.start-app small{
  display:block;
  margin-top:2px;
  color:var(--muted);
  font-size:9px;
}

/* WINDOWS */

.window{
  position:absolute;
  width:650px;
  height:460px;
  min-width:300px;
  min-height:220px;
  overflow:hidden;
  border:1px solid rgba(255,255,255,.13);
  border-radius:15px;
  background:rgba(13,16,23,.94);
  backdrop-filter:blur(25px);
  box-shadow:0 30px 100px rgba(0,0,0,.55);
  z-index:100;
}

.window.hidden{
  display:none;
}

.window.maximized{
  left:12px!important;
  top:12px!important;
  width:calc(100% - 24px)!important;
  height:calc(100% - 82px)!important;
}

.titlebar{
  height:43px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 8px 0 14px;
  border-bottom:1px solid var(--border);
  background:rgba(255,255,255,.025);
  cursor:grab;
}

.titlebar:active{
  cursor:grabbing;
}

.title{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:12px;
  font-weight:bold;
}

.title-symbol{
  color:#aaa2ff;
  font-size:9px;
}

.window-buttons{
  display:flex;
  gap:4px;
}

.window-buttons button{
  width:30px;
  height:28px;
  border:0;
  border-radius:7px;
  background:transparent;
  color:#9da4b3;
}

.window-buttons button:hover{
  background:rgba(255,255,255,.08);
}

.window-buttons .close:hover{
  background:#b94055;
  color:white;
}

.window-content{
  height:calc(100% - 43px);
  overflow:auto;
}

/* COMMON APP */

.app-padding{
  padding:20px;
}

.app-heading{
  margin:0 0 5px;
  font-size:18px;
}

.app-description{
  margin:0 0 20px;
  color:var(--muted);
  font-size:11px;
}

/* EXPLORER */

.path-bar{
  display:flex;
  gap:7px;
  margin-bottom:15px;
}

.path{
  flex:1;
  padding:10px 12px;
  border:1px solid var(--border);
  border-radius:8px;
  background:#090b10;
  color:#8f97a8;
  font-size:11px;
}

.file-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
}

.file{
  min-height:95px;
  padding:14px 8px;
  border:1px solid var(--border);
  border-radius:10px;
  background:rgba(255,255,255,.025);
  text-align:center;
}

.file:hover{
  background:rgba(124,108,255,.1);
}

.file-icon{
  width:35px;
  height:35px;
  margin:auto;
  display:grid;
  place-items:center;
  border-radius:9px;
  background:rgba(124,108,255,.1);
  color:#aaa2ff;
  font-size:9px;
  font-weight:bold;
}

.file b{
  display:block;
  margin-top:8px;
  font-size:10px;
}

.file small{
  color:var(--muted);
  font-size:8px;
}

/* NOTES */

.notes{
  width:100%;
  height:100%;
  padding:18px;
  display:flex;
  flex-direction:column;
}

.notes textarea{
  flex:1;
  width:100%;
  resize:none;
  outline:none;
  border:1px solid var(--border);
  border-radius:10px;
  padding:15px;
  background:#090b10;
  color:#e9ecf2;
  line-height:1.7;
  font-size:13px;
}

.notes-bottom{
  display:flex;
  justify-content:space-between;
  margin-top:8px;
  color:var(--muted);
  font-size:9px;
}

/* CALCULATOR */

.calc{
  max-width:350px;
  margin:auto;
  padding:25px;
}

.calc-display{
  height:70px;
  padding:17px;
  overflow:hidden;
  border:1px solid var(--border);
  border-radius:11px;
  background:#080a0e;
  text-align:right;
  font-size:27px;
  font-weight:bold;
  margin-bottom:10px;
}

.calc-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:6px;
}

.calc-grid button{
  height:53px;
  border:1px solid var(--border);
  border-radius:9px;
  background:rgba(255,255,255,.045);
  font-size:13px;
}

.calc-grid button:hover{
  background:rgba(124,108,255,.16);
}

.calc-grid .operator{
  color:#aaa2ff;
}

/* TERMINAL */

.terminal{
  height:100%;
  padding:18px;
  background:#07090d;
  color:#b8c2d4;
  font-family:Consolas,monospace;
  font-size:12px;
  overflow:auto;
}

.terminal-output{
  white-space:pre-wrap;
  line-height:1.6;
}

.terminal-line{
  display:flex;
  gap:7px;
  margin-top:5px;
}

.terminal-line span{
  color:#7f75ff;
}

.terminal-line input{
  flex:1;
  border:0;
  outline:0;
  background:transparent;
  color:white;
  font-family:inherit;
}

/* BROWSER */

.browser{
  height:100%;
  display:flex;
  flex-direction:column;
}

.browser-bar{
  display:flex;
  gap:7px;
  padding:10px;
  border-bottom:1px solid var(--border);
}

.browser-bar input{
  flex:1;
  padding:9px 11px;
  outline:none;
  border:1px solid var(--border);
  border-radius:8px;
  background:#090b10;
  color:white;
  font-size:11px;
}

.browser-bar button{
  border:1px solid var(--border);
  border-radius:8px;
  background:rgba(255,255,255,.05);
  padding:0 13px;
}

.browser-page{
  flex:1;
  padding:35px;
  overflow:auto;
}

.browser-logo{
  font-size:30px;
  font-weight:900;
  letter-spacing:-2px;
}

.browser-logo span{
  color:#8e83ff;
}

.search-result{
  margin-top:25px;
  padding:15px;
  border:1px solid var(--border);
  border-radius:10px;
  background:rgba(255,255,255,.025);
}

.search-result b{
  font-size:13px;
}

.search-result p{
  color:var(--muted);
  font-size:11px;
  line-height:1.6;
}

/* SETTINGS */

.settings{
  padding:20px;
}

.setting-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:15px 0;
  border-bottom:1px solid var(--border);
}

.setting-row b{
  font-size:12px;
}

.setting-row small{
  display:block;
  color:var(--muted);
  margin-top:4px;
  font-size:9px;
}

.wallpapers{
  display:flex;
  gap:7px;
}

.wall{
  width:38px;
  height:30px;
  border:2px solid transparent;
  border-radius:7px;
}

.wall:hover{
  border-color:white;
}

.wall.one{
  background:linear-gradient(135deg,#171334,#08798c);
}

.wall.two{
  background:linear-gradient(135deg,#2b071b,#170b38);
}

.wall.three{
  background:linear-gradient(135deg,#032331,#04115e);
}

.wall.four{
  background:linear-gradient(135deg,#2b1807,#090909);
}

/* ABOUT */

.about{
  padding:35px;
  text-align:center;
}

.nova-logo{
  width:80px;
  height:80px;
  margin:auto;
  display:grid;
  place-items:center;
  border-radius:22px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  box-shadow:0 15px 50px rgba(124,108,255,.3);
  font-weight:900;
  font-size:18px;
}

.about h2{
  margin:18px 0 7px;
}

.about p{
  color:var(--muted);
  font-size:11px;
  line-height:1.7;
}

/* MOBILE */

@media(max-width:700px){

  .desktop-icons{
    grid-template-columns:repeat(3,70px);
    gap:12px 5px;
    left:10px;
    top:12px;
  }

  .desktop-icon{
    width:70px;
  }

  .window{
    left:7px!important;
    top:7px!important;
    width:calc(100% - 14px)!important;
    height:calc(100% - 82px)!important;
    border-radius:13px;
  }

  .file-grid{
    grid-template-columns:repeat(3,1fr);
  }

  .start-menu{
    width:calc(100vw - 24px);
  }

  .taskbar{
    left:7px;
    right:7px;
    bottom:7px;
  }

  .clock{
    min-width:60px;
  }

  .task-app:nth-child(n+4){
    display:none;
  }
}
</style>
</head>


<body>

<div id="desktop">

  <!-- DESKTOP ICONS -->

  <div class="desktop-icons">

    <button class="desktop-icon" ondblclick="openApp('explorer')">
      <div class="icon-box">FILES</div>
      <span>내 파일</span>
    </button>

    <button class="desktop-icon" ondblclick="openApp('notes')">
      <div class="icon-box">NOTE</div>
      <span>메모장</span>
    </button>

    <button class="desktop-icon" ondblclick="openApp('browser')">
      <div class="icon-box">WEB</div>
      <span>NOVA 브라우저</span>
    </button>

    <button class="desktop-icon" ondblclick="openApp('about')">
      <div class="icon-box">NOVA</div>
      <span>NOVA OS</span>
    </button>

  </div>


  <!-- START MENU -->

  <div class="start-menu" id="startMenu">

    <div class="start-top">

      <div class="user-avatar">N</div>

      <div>
        <div class="start-title">NOVA USER</div>
        <div class="start-sub">Welcome to NOVA OS</div>
      </div>

    </div>

    <div class="app-list">

      <button class="start-app" onclick="openApp('explorer')">
        <div class="start-app-icon">FILES</div>
        <div>
          <b>파일 탐색기</b>
          <small>내 파일 보기</small>
        </div>
      </button>

      <button class="start-app" onclick="openApp('notes')">
        <div class="start-app-icon">NOTE</div>
        <div>
          <b>메모장</b>
          <small>텍스트 작성</small>
        </div>
      </button>

      <button class="start-app" onclick="openApp('calculator')">
        <div class="start-app-icon">CALC</div>
        <div>
          <b>계산기</b>
          <small>빠른 계산</small>
        </div>
      </button>

      <button class="start-app" onclick="openApp('terminal')">
        <div class="start-app-icon">TERM</div>
        <div>
          <b>터미널</b>
          <small>명령어 실행</small>
        </div>
      </button>

      <button class="start-app" onclick="openApp('browser')">
        <div class="start-app-icon">WEB</div>
        <div>
          <b>브라우저</b>
          <small>인터넷 느낌</small>
        </div>
      </button>

      <button class="start-app" onclick="openApp('settings')">
        <div class="start-app-icon">SET</div>
        <div>
          <b>설정</b>
          <small>OS 설정</small>
        </div>
      </button>

    </div>

  </div>


  <!-- WINDOWS CONTAINER -->

  <div id="windows"></div>


  <!-- TASKBAR -->

  <div class="taskbar">

    <button class="start-button" onclick="toggleStart()">
      N
    </button>

    <div class="task-apps" id="taskApps"></div>

    <div class="clock">
      <div id="time">00:00</div>
      <div id="date">0000.00.00</div>
    </div>

  </div>

</div>


<script>

/* ==========================
   STORAGE
========================== */

const storageKey="novaOS";

let saved={};

try{
  saved=JSON.parse(
    localStorage.getItem(storageKey)||"{}"
  );
}catch(e){
  saved={};
}

function saveData(){

  try{
    localStorage.setItem(
      storageKey,
      JSON.stringify(saved)
    );
  }catch(e){}

}


/* ==========================
   CLOCK
========================== */

function updateClock(){

  const now=new Date();

  const hh=
    String(now.getHours()).padStart(2,"0");

  const mm=
    String(now.getMinutes()).padStart(2,"0");

  const yyyy=
    now.getFullYear();

  const mo=
    String(now.getMonth()+1).padStart(2,"0");

  const dd=
    String(now.getDate()).padStart(2,"0");

  document.getElementById("time")
    .textContent=`${hh}:${mm}`;

  document.getElementById("date")
    .textContent=`${yyyy}.${mo}.${dd}`;

}

updateClock();

setInterval(updateClock,1000);


/* ==========================
   START MENU
========================== */

function toggleStart(){

  document
    .getElementById("startMenu")
    .classList.toggle("open");

}

document.addEventListener("click",function(e){

  const menu=
    document.getElementById("startMenu");

  const button=
    document.querySelector(".start-button");

  if(
    menu.classList.contains("open") &&
    !menu.contains(e.target) &&
    !button.contains(e.target)
  ){
    menu.classList.remove("open");
  }

});


/* ==========================
   APP SYSTEM
========================== */

const apps={
  explorer:{
    title:"파일 탐색기",
    symbol:"FILES"
  },
  notes:{
    title:"메모장",
    symbol:"NOTE"
  },
  calculator:{
    title:"계산기",
    symbol:"CALC"
  },
  terminal:{
    title:"터미널",
    symbol:"TERM"
  },
  browser:{
    title:"NOVA 브라우저",
    symbol:"WEB"
  },
  settings:{
    title:"설정",
    symbol:"SET"
  },
  about:{
    title:"NOVA OS",
    symbol:"NOVA"
  }
};

let zIndex=100;
let windowCount=0;

const openWindows={};


function openApp(name){

  document
    .getElementById("startMenu")
    .classList.remove("open");

  if(openWindows[name]){

    const win=openWindows[name];

    win.classList.remove("hidden");

    bringToFront(win);

    return;

  }

  const info=apps[name];

  if(!info) return;

  const win=
    document.createElement("div");

  win.className="window";

  win.id="window-"+name;

  win.style.zIndex=++zIndex;

  const offset=
    (windowCount%5)*25;

  win.style.left=
    `calc(50% - 325px + ${offset}px)`;

  win.style.top=
    `calc(50% - 230px + ${offset}px)`;

  win.innerHTML=`

    <div class="titlebar">

      <div class="title">
        <span class="title-symbol">
          ${info.symbol}
        </span>
        ${info.title}
      </div>

      <div class="window-buttons">

        <button
          onclick="minimizeWindow('${name}')"
        >−</button>

        <button
          onclick="maximizeWindow('${name}')"
        >□</button>

        <button
          class="close"
          onclick="closeWindow('${name}')"
        >×</button>

      </div>

    </div>

    <div class="window-content">
      ${getAppHTML(name)}
    </div>

  `;

  document
    .getElementById("windows")
    .appendChild(win);

  openWindows[name]=win;

  windowCount++;

  makeDraggable(win);

  bringToFront(win);

  addTaskApp(name);

  initializeApp(name);

}


function closeWindow(name){

  const win=openWindows[name];

  if(!win) return;

  win.remove();

  delete openWindows[name];

  const task=
    document.querySelector(
      `[data-task="${name}"]`
    );

  if(task)
    task.remove();

}


function minimizeWindow(name){

  const win=openWindows[name];

  if(win)
    win.classList.add("hidden");

}


function maximizeWindow(name){

  const win=openWindows[name];

  if(!win) return;

  win.classList.toggle("maximized");

}


function bringToFront(win){

  win.style.zIndex=++zIndex;

}


document
  .getElementById("windows")
  .addEventListener("mousedown",function(e){

    const win=e.target.closest(".window");

    if(win)
      bringToFront(win);

  });


/* ==========================
   TASKBAR APPS
========================== */

function addTaskApp(name){

  const bar=
    document.getElementById("taskApps");

  const button=
    document.createElement("button");

  button.className="task-app";

  button.dataset.task=name;

  button.textContent=
    apps[name].symbol;

  button.onclick=function(){

    const win=openWindows[name];

    if(!win) return;

    if(win.classList.contains("hidden")){

      win.classList.remove("hidden");
      bringToFront(win);

    }else{

      minimizeWindow(name);

    }

  };

  bar.appendChild(button);

}


/* ==========================
   DRAG WINDOWS
========================== */

function makeDraggable(win){

  const titlebar=
    win.querySelector(".titlebar");

  let dragging=false;
  let offsetX=0;
  let offsetY=0;

  titlebar.addEventListener(
    "mousedown",
    function(e){

      if(
        e.target.closest(".window-buttons")
      )
        return;

      if(win.classList.contains("maximized"))
        return;

      dragging=true;

      const rect=
        win.getBoundingClientRect();

      offsetX=e.clientX-rect.left;
      offsetY=e.clientY-rect.top;

      bringToFront(win);

    }
  );

  document.addEventListener(
    "mousemove",
    function(e){

      if(!dragging) return;

      let x=
        e.clientX-offsetX;

      let y=
        e.clientY-offsetY;

      x=Math.max(
        0,
        Math.min(
          window.innerWidth-win.offsetWidth,
          x
        )
      );

      y=Math.max(
        0,
        Math.min(
          window.innerHeight-win.offsetHeight-70,
          y
        )
      );

      win.style.left=x+"px";
      win.style.top=y+"px";

    }
  );

  document.addEventListener(
    "mouseup",
    function(){

      dragging=false;

    }
  );

}

/* ==========================
   APP INITIALIZATION
========================== */

function initializeApp(name){

  if(name==="notes"){

    const area=
      document.getElementById("notesArea");

    area.value=
      saved.notes || "";

    area.addEventListener(
      "input",
      function(){

        saved.notes=this.value;
        saveData();

        const status=
          document.getElementById("noteStatus");

        status.textContent="저장 중...";

        clearTimeout(
          window.noteSaveTimer
        );

        window.noteSaveTimer=
          setTimeout(()=>{

            status.textContent="저장됨";

          },400);

      }
    );

  }


  if(name==="terminal"){

    const input=
      document.getElementById(
        "terminalInput"
      );

    input.focus();

    input.addEventListener(
      "keydown",
      function(e){

        if(e.key!=="Enter")
          return;

        const command=
          input.value.trim();

        runTerminalCommand(command);

        input.value="";

      }
    );

  }


  if(name==="browser"){

    const input=
      document.getElementById(
        "browserInput"
      );

    input.addEventListener(
      "keydown",
      function(e){

        if(e.key==="Enter")
          browserGo();

      }
    );

  }

}


/* ==========================
   CALCULATOR
========================== */

let calcValue="0";

function updateCalc(){

  const display=
    document.getElementById("calcDisplay");

  if(display)
    display.textContent=calcValue;

}

function calcInput(value){

  if(calcValue==="0" &&
     ![".","+","-","*","/","%"]
       .includes(value)
  ){
    calcValue=value;
  }else{
    calcValue+=value;
  }

  updateCalc();

}

function calcClear(){

  calcValue="0";
  updateCalc();

}

function calcDelete(){

  calcValue=
    calcValue.length>1
    ? calcValue.slice(0,-1)
    : "0";

  updateCalc();

}

function calcEqual(){

  try{

    if(!/^[0-9+\-*/%.() ]+$/.test(calcValue))
      throw new Error();

    const result=
      Function(
        "return ("+
        calcValue+
        ")"
      )();

    if(!Number.isFinite(result))
      throw new Error();

    calcValue=
      String(
        Math.round(result*100000000)/100000000
      );

  }catch(e){

    calcValue="ERROR";

  }

  updateCalc();

}


/* ==========================
   TERMINAL
========================== */

function runTerminalCommand(command){

  const output=
    document.getElementById(
      "terminalOutput"
    );

  if(!output)
    return;

  output.textContent+=
    "NOVA> "+command+"\n";

  let result="";

  const cmd=
    command.toLowerCase();

  if(cmd===""){
    result="";
  }

  else if(cmd==="help"){

    result=
`Available commands:

help       명령어 목록
clear      터미널 초기화
date       현재 날짜
time       현재 시간
whoami     사용자 정보
about      OS 정보
neofetch   시스템 정보
echo       텍스트 출력`;

  }

  else if(cmd==="clear"){

    output.textContent="";
    return;

  }

  else if(cmd==="date"){

    result=
      new Date().toLocaleDateString("ko-KR");

  }

  else if(cmd==="time"){

    result=
      new Date().toLocaleTimeString("ko-KR");

  }

  else if(cmd==="whoami"){

    result="nova-user";

  }

  else if(cmd==="about"){

    result=
`NOVA OS
Web Virtual Operating System
Version 1.0`;

  }

  else if(cmd==="neofetch"){

    result=
`       N O V A
----------------------
OS       NOVA OS 1.0
Kernel   NOVA-Web
Shell    NOVA Terminal
Browser  Web Browser
Storage  localStorage
Status   ONLINE`;

  }

  else if(cmd.startsWith("echo ")){

    result=
      command.substring(5);

  }

  else{

    result=
      `"${command}" 명령어를 찾을 수 없습니다.`;

  }

  output.textContent+=
    result+"\n\n";

  const terminal=
    document.querySelector(".terminal");

  if(terminal)
    terminal.scrollTop=
      terminal.scrollHeight;

}


/* ==========================
   BROWSER
========================== */

function browserGo(){

  const input=
    document.getElementById(
      "browserInput"
    );

  const page=
    document.getElementById(
      "browserPage"
    );

  if(!input || !page)
    return;

  const value=
    input.value.trim();

  if(!value)
    return;

  if(
    value==="nova://home" ||
    value==="home"
  ){

    page.innerHTML=`

      <div class="browser-logo">
        NOVA<span>WEB</span>
      </div>

      <p
        style="
          color:#9299aa;
          font-size:11px;
        "
      >
        Welcome to NOVA Web.
      </p>

      <div class="search-result">
        <b>Home</b>
        <p>
          가상 브라우저 홈 화면입니다.
        </p>
      </div>

    `;

    return;

  }

  page.innerHTML=`

    <div class="browser-logo">
      Search
    </div>

    <div class="search-result">

      <b>
        ${escapeHTML(value)}
      </b>

      <p>
        "${escapeHTML(value)}"에 대한
        가상 검색 결과입니다.
      </p>

    </div>

    <div class="search-result">

      <b>NOVA Result</b>

      <p>
        이 브라우저는 데모용 가상 브라우저라
        실제 웹사이트를 불러오지 않습니다.
      </p>

    </div>

  `;

}


function escapeHTML(text){

  return text
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* ==========================
   WALLPAPER
========================== */

function setWallpaper(num){

  const desktop=
    document.getElementById(
      "desktop"
    );

  desktop.classList.remove(
    "wallpaper2",
    "wallpaper3",
    "wallpaper4"
  );

  if(num===2)
    desktop.classList.add("wallpaper2");

  if(num===3)
    desktop.classList.add("wallpaper3");

  if(num===4)
    desktop.classList.add("wallpaper4");

  saved.wallpaper=num;

  saveData();

}


function loadWallpaper(){

  const num=
    saved.wallpaper || 1;

  setWallpaper(num);

}


/* ==========================
   ACCENT
========================== */

function setAccent(color){

  document.documentElement
    .style.setProperty(
      "--accent",
      color
    );

  saved.accent=color;

  saveData();

}


/* ==========================
   RESET
========================== */

function resetOS(){

  if(
    !confirm(
      "저장된 메모와 설정을 초기화할까요?"
    )
  )
    return;

  saved={};

  try{
    localStorage.removeItem(storageKey);
  }catch(e){}

  location.reload();

}


/* ==========================
   INITIAL LOAD
========================== */

if(saved.accent){

  document.documentElement
    .style.setProperty(
      "--accent",
      saved.accent
    );

}

loadWallpaper();


/* ==========================
   KEYBOARD SHORTCUTS
========================== */

document.addEventListener(
  "keydown",
  function(e){

    if(
      e.ctrlKey &&
      e.altKey &&
      e.key.toLowerCase()==="t"
    ){

      e.preventDefault();
      openApp("terminal");

    }

    if(
      e.ctrlKey &&
      e.altKey &&
      e.key.toLowerCase()==="n"
    ){

      e.preventDefault();
      openApp("notes");

    }

  }
);
