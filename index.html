<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>NovaOS</title>

<style>
*{box-sizing:border-box}
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
    color:#fff;
    background:#101114;
}
button,input,textarea{font:inherit}
button{cursor:pointer}

:root{
    --accent:#0a84ff;
    --glass:rgba(25,27,32,.72);
    --glass2:rgba(255,255,255,.10);
    --border:rgba(255,255,255,.15);
}

/* ================= DESKTOP ================= */

#desktop{
    position:relative;
    width:100%;
    height:100%;
    overflow:hidden;
    background:
        radial-gradient(circle at 20% 20%,rgba(80,120,255,.28),transparent 32%),
        radial-gradient(circle at 80% 70%,rgba(130,50,255,.20),transparent 35%),
        linear-gradient(135deg,#10131c,#1b1d2a 45%,#090a0d);
    transition:.4s;
}

#desktop.wall2{
    background:
        radial-gradient(circle at 70% 25%,rgba(0,170,255,.32),transparent 30%),
        radial-gradient(circle at 25% 80%,rgba(0,255,180,.18),transparent 35%),
        linear-gradient(135deg,#061219,#101c28,#05080b);
}

#desktop.wall3{
    background:
        radial-gradient(circle at 30% 25%,rgba(255,80,130,.25),transparent 30%),
        radial-gradient(circle at 75% 75%,rgba(255,170,0,.18),transparent 35%),
        linear-gradient(135deg,#180b15,#22101a,#09070b);
}

#desktop.wall4{
    background:
        radial-gradient(circle at 50% 30%,rgba(160,90,255,.3),transparent 35%),
        radial-gradient(circle at 20% 80%,rgba(30,120,255,.2),transparent 35%),
        linear-gradient(135deg,#0b0717,#130b24,#050509);
}

/* ================= MENU BAR ================= */

#menubar{
    position:absolute;
    top:0;
    left:0;
    right:0;
    height:34px;
    z-index:9999;
    display:flex;
    align-items:center;
    padding:0 13px;
    background:rgba(20,20,24,.62);
    backdrop-filter:blur(25px);
    border-bottom:1px solid rgba(255,255,255,.08);
    font-size:13px;
    user-select:none;
}

.menu-left,.menu-right{
    display:flex;
    align-items:center;
    gap:15px;
}

.menu-left{flex:1}
.menu-right{gap:12px}

.apple{
    font-size:18px;
    font-weight:700;
}

.menu-item{
    opacity:.92;
    white-space:nowrap;
}

.status{
    opacity:.9;
    white-space:nowrap;
}

/* ================= DESKTOP ICONS ================= */

#icons{
    position:absolute;
    top:52px;
    left:20px;
    display:grid;
    grid-template-columns:90px;
    gap:20px;
}

.desktop-icon{
    width:78px;
    min-height:82px;
    border-radius:12px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:7px;
    color:white;
    text-align:center;
    font-size:12px;
    user-select:none;
    transition:.15s;
}

.desktop-icon:hover{
    background:rgba(255,255,255,.10);
}

.icon-box{
    width:52px;
    height:52px;
    border-radius:14px;
    display:grid;
    place-items:center;
    font-size:26px;
    background:linear-gradient(145deg,#454955,#181a20);
    box-shadow:0 8px 20px rgba(0,0,0,.3);
}

/* ================= WINDOWS ================= */

#windows{
    position:absolute;
    top:34px;
    left:0;
    right:0;
    bottom:0;
    pointer-events:none;
}

.window{
    position:absolute;
    width:760px;
    max-width:calc(100vw - 40px);
    height:540px;
    max-height:calc(100vh - 100px);
    min-width:300px;
    min-height:220px;
    overflow:hidden;
    border:1px solid var(--border);
    border-radius:15px;
    background:rgba(23,25,30,.83);
    backdrop-filter:blur(30px) saturate(130%);
    box-shadow:0 25px 70px rgba(0,0,0,.45);
    pointer-events:auto;
    animation:windowIn .18s ease;
}

@keyframes windowIn{
    from{opacity:0;transform:scale(.97)}
    to{opacity:1;transform:scale(1)}
}

.window.focused{
    border-color:rgba(255,255,255,.23);
}

.window-head{
    height:45px;
    display:flex;
    align-items:center;
    padding:0 13px;
    background:rgba(255,255,255,.055);
    border-bottom:1px solid rgba(255,255,255,.08);
    user-select:none;
    touch-action:none;
}

.traffic{
    display:flex;
    gap:8px;
}

.traffic button{
    width:13px;
    height:13px;
    border-radius:50%;
    border:0;
    padding:0;
    background:#555;
}

.traffic .close{background:#ff5f57}
.traffic .min{background:#febc2e}
.traffic .max{background:#28c840}

.window-title{
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    font-size:13px;
    font-weight:600;
    opacity:.9;
}

.window-body{
    height:calc(100% - 45px);
    overflow:auto;
}

/* ================= COMMON APP ================= */

.app{
    padding:25px;
}

.app h1{
    margin:0 0 7px;
    font-size:28px;
}

.app p{
    color:#aeb2bb;
}

.card{
    background:rgba(255,255,255,.065);
    border:1px solid rgba(255,255,255,.10);
    border-radius:15px;
    padding:18px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:14px;
}

.action{
    border:0;
    color:#fff;
    background:rgba(255,255,255,.09);
    border:1px solid rgba(255,255,255,.10);
    border-radius:12px;
    padding:12px 15px;
    transition:.15s;
}

.action:hover{
    background:rgba(255,255,255,.15);
}

.action.primary{
    background:var(--accent);
    border-color:transparent;
}

.big{
    font-size:42px;
    font-weight:700;
}

.muted{
    color:#9da1ab;
}

.row{
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
}

/* ================= FINDER ================= */

.finder{
    height:100%;
    display:flex;
}

.sidebar{
    width:185px;
    flex:none;
    padding:18px 12px;
    background:rgba(0,0,0,.15);
    border-right:1px solid rgba(255,255,255,.08);
}

.side-title{
    color:#8f939d;
    font-size:11px;
    margin:10px 10px 6px;
    text-transform:uppercase;
}

.side-btn{
    width:100%;
    padding:9px 11px;
    border:0;
    border-radius:8px;
    background:transparent;
    color:#ddd;
    text-align:left;
}

.side-btn:hover{
    background:rgba(255,255,255,.08);
}

.files{
    flex:1;
    padding:25px;
}

.file-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(100px,1fr));
    gap:20px;
}

.file{
    text-align:center;
    padding:15px 8px;
    border-radius:10px;
}

.file:hover{
    background:rgba(255,255,255,.08);
}

.file-icon{
    font-size:40px;
    margin-bottom:8px;
}

/* ================= NOTES ================= */

.notes{
    display:flex;
    height:100%;
}

.note-list{
    width:210px;
    border-right:1px solid rgba(255,255,255,.08);
    padding:15px;
}

.note-editor{
    flex:1;
    padding:22px;
}

.note-editor textarea{
    width:100%;
    height:100%;
    resize:none;
    border:0;
    outline:0;
    background:transparent;
    color:white;
    font-size:17px;
    line-height:1.6;
}

/* ================= CALCULATOR ================= */

.calc{
    width:330px;
    margin:auto;
    padding:20px;
}

.calc-display{
    height:80px;
    display:flex;
    align-items:end;
    justify-content:end;
    padding:10px;
    font-size:38px;
    overflow:hidden;
    border-radius:13px;
    background:rgba(0,0,0,.25);
    margin-bottom:12px;
}

.calc-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
}

.calc-grid button{
    height:58px;
    border:0;
    border-radius:13px;
    background:#3a3b40;
    color:white;
    font-size:20px;
}

.calc-grid button:hover{
    background:#505158;
}

.calc-grid .op{
    background:var(--accent);
}

.calc-grid .wide{
    grid-column:span 2;
}

/* ================= TERMINAL ================= */

.terminal{
    height:100%;
    background:#090a0c;
    color:#d7d7d7;
    padding:18px;
    font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
    overflow:auto;
}

.term-line{
    white-space:pre-wrap;
    margin-bottom:5px;
}

.term-input{
    display:flex;
    gap:8px;
}

.term-input input{
    flex:1;
    background:transparent;
    border:0;
    outline:0;
    color:white;
    font-family:inherit;
}

/* ================= BROWSER ================= */

.browser{
    height:100%;
    display:flex;
    flex-direction:column;
}

.browser-bar{
    display:flex;
    gap:8px;
    padding:10px;
    border-bottom:1px solid rgba(255,255,255,.08);
}

.browser-bar input{
    flex:1;
    min-width:0;
    border:0;
    outline:0;
    color:white;
    background:rgba(255,255,255,.08);
    border-radius:9px;
    padding:9px 12px;
}

.browser-page{
    flex:1;
    padding:30px;
    overflow:auto;
}

.search-result{
    padding:15px;
    border-radius:12px;
    background:rgba(255,255,255,.06);
    margin:10px 0;
}

/* ================= SETTINGS ================= */

.settings-grid{
    display:grid;
    grid-template-columns:220px 1fr;
    height:100%;
}

.settings-menu{
    padding:18px;
    border-right:1px solid rgba(255,255,255,.08);
}

.settings-content{
    padding:25px;
    overflow:auto;
}

.wallpapers{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
}

.wall{
    height:90px;
    border-radius:12px;
    border:2px solid transparent;
    cursor:pointer;
}

.wall.active{
    border-color:var(--accent);
}

.w0{
    background:linear-gradient(135deg,#111827,#312e81);
}

.w1{
    background:linear-gradient(135deg,#061219,#0c4a6e,#064e3b);
}

.w2{
    background:linear-gradient(135deg,#3b0a27,#7f1d1d,#78350f);
}

.w3{
    background:linear-gradient(135deg,#1e1b4b,#581c87,#172554);
}

/* ================= LAUNCHPAD ================= */

#launchpad{
    position:absolute;
    inset:34px 0 0;
    z-index:8000;
    display:none;
    padding:50px;
    background:rgba(8,9,12,.78);
    backdrop-filter:blur(35px);
    overflow:auto;
}

.launch-title{
    text-align:center;
    font-size:30px;
    margin-bottom:35px;
}

.launch-grid{
    max-width:800px;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(110px,1fr));
    gap:25px;
}

.launch-app{
    border:0;
    background:transparent;
    color:white;
    padding:10px;
    border-radius:15px;
}

.launch-app:hover{
    background:rgba(255,255,255,.08);
}

.launch-icon{
    width:68px;
    height:68px;
    margin:auto auto 9px;
    border-radius:18px;
    display:grid;
    place-items:center;
    font-size:34px;
    background:linear-gradient(145deg,#454954,#18191e);
    box-shadow:0 12px 30px rgba(0,0,0,.3);
}

/* ================= DOCK ================= */

#dock{
    position:absolute;
    bottom:14px;
    left:50%;
    transform:translateX(-50%);
    z-index:9998;
    display:flex;
    align-items:end;
    gap:8px;
    padding:8px 10px;
    border:1px solid rgba(255,255,255,.16);
    border-radius:20px;
    background:rgba(30,31,36,.66);
    backdrop-filter:blur(30px);
    box-shadow:0 15px 50px rgba(0,0,0,.4);
}

.dock-btn{
    width:55px;
    height:55px;
    border:0;
    border-radius:15px;
    display:grid;
    place-items:center;
    font-size:27px;
    color:white;
    background:linear-gradient(145deg,#4b4e58,#1b1c21);
    transition:.16s;
}

.dock-btn:hover{
    transform:translateY(-7px) scale(1.08);
}

.dock-separator{
    width:1px;
    height:42px;
    background:rgba(255,255,255,.18);
    margin:0 3px;
}

/* ================= GAME CENTER ================= */

.game-center{
    padding:25px;
}

.game-hero{
    padding:22px;
    border-radius:18px;
    background:
        radial-gradient(circle at 80% 20%,rgba(0,132,255,.3),transparent 35%),
        rgba(255,255,255,.055);
    border:1px solid rgba(255,255,255,.10);
    margin-bottom:18px;
}

.game-hero h1{
    margin:0;
    font-size:30px;
}

.game-list{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
    gap:14px;
}

.game-card{
    padding:18px;
    border-radius:16px;
    background:rgba(255,255,255,.065);
    border:1px solid rgba(255,255,255,.10);
    transition:.15s;
}

.game-card:hover{
    transform:translateY(-2px);
    background:rgba(255,255,255,.10);
}

.game-symbol{
    font-size:36px;
    margin-bottom:10px;
}

.game-card h3{
    margin:0 0 5px;
}

.game-card p{
    margin:0 0 15px;
    font-size:13px;
}

.score-line{
    margin-top:8px;
    font-size:12px;
    color:#9da1ab;
}

/* GAME PLAY AREA */

.game-screen{
    padding:25px;
    height:100%;
}

.game-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:15px;
    flex-wrap:wrap;
}

.game-board{
    position:relative;
    width:100%;
    max-width:600px;
    height:350px;
    margin:auto;
    border-radius:18px;
    background:#101217;
    border:1px solid rgba(255,255,255,.10);
    overflow:hidden;
}

/* snake */

.snake-cell{
    position:absolute;
    width:18px;
    height:18px;
    border-radius:5px;
    background:var(--accent);
}

.snake-food{
    position:absolute;
    width:18px;
    height:18px;
    border-radius:50%;
    background:#ff5f57;
}

/* target */

.target{
    position:absolute;
    width:45px;
    height:45px;
    border-radius:50%;
    border:0;
    background:var(--accent);
    box-shadow:0 0 25px rgba(10,132,255,.35);
}

/* reaction */

.reaction-box{
    width:100%;
    height:100%;
    display:grid;
    place-items:center;
    font-size:25px;
    font-weight:700;
    user-select:none;
    cursor:pointer;
    background:#25272d;
}

.reaction-box.ready{
    background:#27ae60;
}

.reaction-box.wait{
    background:#c0392b;
}

/* memory */

.memory-number{
    display:grid;
    place-items:center;
    height:100%;
    font-size:65px;
    font-weight:800;
}

/* math */

.math-box{
    display:grid;
    place-items:center;
    height:100%;
    gap:20px;
}

.math-question{
    font-size:48px;
    font-weight:800;
}

.math-answer{
    width:220px;
    padding:12px;
    border:1px solid rgba(255,255,255,.15);
    background:rgba(255,255,255,.08);
    border-radius:12px;
    color:white;
    outline:0;
    text-align:center;
    font-size:20px;
}

/* ================= CONTEXT MENU ================= */

#contextMenu{
    position:absolute;
    z-index:10000;
    display:none;
    width:190px;
    padding:6px;
    border-radius:12px;
    background:rgba(30,31,36,.92);
    border:1px solid rgba(255,255,255,.14);
    backdrop-filter:blur(25px);
    box-shadow:0 20px 50px rgba(0,0,0,.4);
}

.context-btn{
    width:100%;
    border:0;
    background:transparent;
    color:white;
    text-align:left;
    padding:9px 11px;
    border-radius:8px;
}

.context-btn:hover{
    background:rgba(255,255,255,.10);
}

/* ================= MOBILE ================= */

@media(max-width:700px){

    #menubar{
        height:38px;
        padding:0 10px;
    }

    .menu-left .menu-item{
        display:none;
    }

    .menu-left{
        gap:8px;
    }

    .status:nth-child(1),
    .status:nth-child(2){
        display:none;
    }

    #windows{
        top:38px;
    }

    .window{
        left:10px !important;
        top:10px !important;
        width:calc(100vw - 20px) !important;
        height:calc(100vh - 90px) !important;
        max-width:none;
        max-height:none;
    }

    #icons{
        grid-template-columns:repeat(3,80px);
        gap:10px;
        left:10px;
        top:55px;
    }

    .sidebar{
        width:125px;
    }

    .settings-grid{
        grid-template-columns:120px 1fr;
    }

    .dock-btn{
        width:48px;
        height:48px;
        font-size:23px;
    }

    #dock{
        bottom:8px;
        max-width:calc(100vw - 16px);
        overflow:auto;
    }

    .game-board{
        height:300px;
    }

    .wallpapers{
        grid-template-columns:repeat(2,1fr);
    }
}
</style>
</head>

<body>

<div id="desktop">

    <!-- MENU BAR -->
    <div id="menubar">
        <div class="menu-left">
            <span class="apple">●</span>
            <span class="menu-item">NovaOS</span>
            <span class="menu-item">파일</span>
            <span class="menu-item">편집</span>
            <span class="menu-item">보기</span>
            <span class="menu-item">이동</span>
            <span class="menu-item">도움말</span>
        </div>

        <div class="menu-right">
            <span class="status">Wi-Fi</span>
            <span class="status">100%</span>
            <span id="liveTime">00:00</span>
        </div>
    </div>

    <!-- DESKTOP ICONS -->
    <div id="icons">

        <div class="desktop-icon" ondblclick="openApp('finder','Finder')">
            <div class="icon-box">▣</div>
            Finder
        </div>

        <div class="desktop-icon" ondblclick="openApp('gamecenter','Game Center')">
            <div class="icon-box">◆</div>
            Game Center
        </div>

        <div class="desktop-icon" ondblclick="openApp('notes','메모')">
            <div class="icon-box">N</div>
            메모
        </div>

        <div class="desktop-icon" ondblclick="openApp('browser','Browser')">
            <div class="icon-box">◎</div>
            Browser
        </div>

    </div>

    <!-- WINDOWS -->
    <div id="windows"></div>

    <!-- LAUNCHPAD -->
    <div id="launchpad">
        <div class="launch-title">Launchpad</div>

        <div class="launch-grid">

            <button class="launch-app" onclick="openApp('finder','Finder');closeLaunchpad()">
                <div class="launch-icon">▣</div>
                Finder
            </button>

            <button class="launch-app" onclick="openApp('gamecenter','Game Center');closeLaunchpad()">
                <div class="launch-icon">◆</div>
                Game Center
            </button>

            <button class="launch-app" onclick="openApp('notes','메모');closeLaunchpad()">
                <div class="launch-icon">N</div>
                메모
            </button>

            <button class="launch-app" onclick="openApp('calculator','계산기');closeLaunchpad()">
                <div class="launch-icon">÷</div>
                계산기
            </button>

            <button class="launch-app" onclick="openApp('terminal','Terminal');closeLaunchpad()">
                <div class="launch-icon">&gt;_</div>
                Terminal
            </button>

            <button class="launch-app" onclick="openApp('browser','Browser');closeLaunchpad()">
                <div class="launch-icon">◎</div>
                Browser
            </button>

            <button class="launch-app" onclick="openApp('settings','설정');closeLaunchpad()">
                <div class="launch-icon">⚙</div>
                설정
            </button>

            <button class="launch-app" onclick="openApp('about','NovaOS 정보');closeLaunchpad()">
                <div class="launch-icon">i</div>
                정보
            </button>

        </div>
    </div>

    <!-- DOCK -->
    <div id="dock">

        <button class="dock-btn" title="Launchpad" onclick="toggleLaunchpad()">⌘</button>

        <button class="dock-btn" title="Finder" onclick="openApp('finder','Finder')">▣</button>

        <button class="dock-btn" title="Game Center" onclick="openApp('gamecenter','Game Center')">◆</button>

        <button class="dock-btn" title="메모" onclick="openApp('notes','메모')">N</button>

        <button class="dock-btn" title="계산기" onclick="openApp('calculator','계산기')">÷</button>

        <button class="dock-btn" title="Terminal" onclick="openApp('terminal','Terminal')">&gt;_</button>

        <button class="dock-btn" title="Browser" onclick="openApp('browser','Browser')">◎</button>

        <div class="dock-separator"></div>

        <button class="dock-btn" title="설정" onclick="openApp('settings','설정')">⚙</button>

    </div>

    <!-- CONTEXT MENU -->
    <div id="contextMenu">
        <button class="context-btn" onclick="openApp('finder','Finder');hideContext()">Finder 열기</button>
        <button class="context-btn" onclick="openApp('gamecenter','Game Center');hideContext()">Game Center</button>

<script>
/* =========================================================
   NOVAOS CORE
========================================================= */

const windows = {};
let zIndex = 20;

function openApp(type,title){

    if(windows[type]){
        windows[type].style.display="block";
        focusWindow(windows[type]);
        return;
    }

    const win=document.createElement("div");

    win.className="window focused";
    win.style.left=(100+Object.keys(windows).length*25)+"px";
    win.style.top=(70+Object.keys(windows).length*25)+"px";
    win.style.zIndex=++zIndex;

    win.innerHTML=`
        <div class="window-head">
            <div class="traffic">
                <button class="close" aria-label="닫기"></button>
                <button class="min" aria-label="최소화"></button>
                <button class="max" aria-label="최대화"></button>
            </div>
            <div class="window-title">${title}</div>
        </div>
        <div class="window-body"></div>
    `;

    document.getElementById("windows").appendChild(win);

    windows[type]=win;

    const body=win.querySelector(".window-body");
    body.innerHTML=getAppContent(type);

    const close=win.querySelector(".close");
    const min=win.querySelector(".min");
    const max=win.querySelector(".max");

    close.onclick=()=>{
        if(type==="gamecenter") stopAllGames();
        win.remove();
        delete windows[type];
    };

    min.onclick=()=>{
        win.style.display="none";
    };

    max.onclick=()=>{
        if(win.dataset.max==="1"){
            win.dataset.max="0";
            win.style.left=win.dataset.oldLeft;
            win.style.top=win.dataset.oldTop;
            win.style.width=win.dataset.oldWidth;
            win.style.height=win.dataset.oldHeight;
        }else{
            win.dataset.max="1";

            win.dataset.oldLeft=win.style.left;
            win.dataset.oldTop=win.style.top;
            win.dataset.oldWidth=win.style.width;
            win.dataset.oldHeight=win.style.height;

            win.style.left="5px";
            win.style.top="5px";
            win.style.width="calc(100vw - 10px)";
            win.style.height="calc(100vh - 70px)";
        }
    };

    win.addEventListener("pointerdown",()=>focusWindow(win));

    makeDraggable(win);

    initializeApp(type);

    focusWindow(win);
}

function focusWindow(win){
    document.querySelectorAll(".window").forEach(w=>w.classList.remove("focused"));
    win.classList.add("focused");
    win.style.zIndex=++zIndex;
}

function makeDraggable(win){

    const head=win.querySelector(".window-head");

    let dragging=false;
    let startX=0;
    let startY=0;
    let startLeft=0;
    let startTop=0;

    head.addEventListener("pointerdown",e=>{

        if(e.target.closest("button")) return;
        if(win.dataset.max==="1") return;

        dragging=true;

        head.setPointerCapture(e.pointerId);

        startX=e.clientX;
        startY=e.clientY;

        startLeft=win.offsetLeft;
        startTop=win.offsetTop;

        focusWindow(win);
    });

    head.addEventListener("pointermove",e=>{

        if(!dragging) return;

        const dx=e.clientX-startX;
        const dy=e.clientY-startY;

        win.style.left=Math.max(0,startLeft+dx)+"px";
        win.style.top=Math.max(34,startTop+dy)+"px";
    });

    head.addEventListener("pointerup",()=>{
        dragging=false;
    });
}

/* =========================================================
   CALCULATOR
========================================================= */

let calcValue="";

function calcInput(v){

    if(calcValue.length>40) return;

    if(v==="." && /[.]$/.test(calcValue)) return;

    calcValue+=v;

    updateCalc();
}

function calcClear(){
    calcValue="";
    updateCalc();
}

function calcEquals(){

    if(!calcValue) return;

    try{

        if(!/^[0-9+\-*/().\s]+$/.test(calcValue)){
            throw new Error();
        }

        const result=Function(
            '"use strict";return ('+calcValue+')'
        )();

        if(!Number.isFinite(result)){
            throw new Error();
        }

        calcValue=String(result);

    }catch{
        calcValue="";
        document.getElementById("calcDisplay").textContent="Error";
        setTimeout(updateCalc,700);
        return;
    }

    updateCalc();
}

function updateCalc(){

    const d=document.getElementById("calcDisplay");

    if(d){
        d.textContent=calcValue||"0";
    }
}

function initTerminal(){

    const input=document.getElementById("termInput");
    const output=document.getElementById("termOutput");

    if(!input) return;

    input.focus();

    input.addEventListener("keydown",e=>{

        if(e.key!=="Enter") return;

        const cmd=input.value.trim();

        if(!cmd) return;

        const line=document.createElement("div");
        line.className="term-line";
        line.textContent="nova@os:~$ "+cmd;

        output.appendChild(line);

        const response=document.createElement("div");
        response.className="term-line";

        const lower=cmd.toLowerCase();

        if(lower==="help"){

            response.textContent=
`help       명령어 목록
clear      화면 지우기
date       현재 시간
games      Game Center 열기
about      시스템 정보
whoami     현재 사용자`;

        }else if(lower==="clear"){

            output.innerHTML="";
            input.value="";
            return;

        }else if(lower==="date"){

            response.textContent=new Date().toLocaleString("ko-KR");

        }else if(lower==="games"){

            response.textContent="Game Center를 실행합니다.";
            openApp("gamecenter","Game Center");

        }else if(lower==="about"){

            response.textContent="NovaOS Web Desktop Environment";

        }else if(lower==="whoami"){

            response.textContent="nova";

        }else{

            response.textContent=`command not found: ${cmd}`;

        }

        output.appendChild(response);

        input.value="";

        const terminal=document.getElementById("terminal");

        if(terminal){
            terminal.scrollTop=terminal.scrollHeight;
        }
    });
}

}

function record(game,value,lowerIsBetter=false){

    const old=gameRecords[game];

    if(
        old===undefined ||
        (lowerIsBetter ? value<old : value>old)
    ){
        gameRecords[game]=value;
        saveRecords();
        return true;
    }

    return false;
}

/* =========================================================
   SNAKE
========================================================= */

function initSnake(){

    const area=document.getElementById("gameArea");
    const status=document.getElementById("gameStatus");

    const cell=18;

    const cols=Math.floor(area.clientWidth/cell);
    const rows=Math.floor(area.clientHeight/cell);

    let snake=[
        {x:Math.floor(cols/2),y:Math.floor(rows/2)}
    ];

    let dir={x:1,y:0};
    let nextDir={x:1,y:0};

    let food={
        x:Math.floor(Math.random()*cols),
        y:Math.floor(Math.random()*rows)
    };

    let score=0;
    let speed=110;

    function draw(){

        area.innerHTML="";

        snake.forEach((s,i)=>{

            const el=document.createElement("div");

            el.className="snake-cell";

            el.style.left=(s.x*cell)+"px";
            el.style.top=(s.y*cell)+"px";

            if(i===0){
                el.style.borderRadius="6px";
            }

            area.appendChild(el);
        });

        const f=document.createElement("div");

        f.className="snake-food";

        f.style.left=(food.x*cell)+"px";
        f.style.top=(food.y*cell)+"px";

        area.appendChild(f);

        status.textContent=`점수: ${score} · 방향키 / WASD`;
    }

    function spawnFood(){

        let valid=false;

        while(!valid){

            food={
                x:Math.floor(Math.random()*cols),
                y:Math.floor(Math.random()*rows)
            };

            valid=!snake.some(
                s=>s.x===food.x&&s.y===food.y
            );
        }
    }

    function step(){

        dir=nextDir;

        const head={
            x:snake[0].x+dir.x,
            y:snake[0].y+dir.y
        };

        if(
            head.x<0 ||
            head.x>=cols ||
            head.y<0 ||
            head.y>=rows ||
            snake.some(s=>s.x===head.x&&s.y===head.y)
        ){

            end();

            return;
        }

        snake.unshift(head);

        if(head.x===food.x&&head.y===food.y){

            score++;

            if(score%5===0){
                speed=Math.max(55,speed-8);
                clearInterval(loop);
                loop=setInterval(step,speed);
                gameIntervals.push(loop);
            }

            spawnFood();

        }else{
            snake.pop();
        }

        draw();
    }

    function end(){

        clearInterval(loop);

        const isRecord=record("snake",score);

        status.textContent=
            `게임 종료 · 점수 ${score}`+
            (isRecord?" · 신기록!":"");

    }

    function key(e){

        const k=e.key.toLowerCase();

        if((k==="arrowup"||k==="w")&&dir.y!==1)
            nextDir={x:0,y:-1};

        if((k==="arrowdown"||k==="s")&&dir.y!==-1)
            nextDir={x:0,y:1};

        if((k==="arrowleft"||k==="a")&&dir.x!==1)
            nextDir={x:-1,y:0};

        if((k==="arrowright"||k==="d")&&dir.x!==-1)
            nextDir={x:1,y:0};
    }

    document.onkeydown=key;

    draw();

    let loop=setInterval(step,speed);

    gameIntervals.push(loop);
}

/* =========================================================
   TARGET CLICK
========================================================= */

function initTarget(){

    const area=document.getElementById("gameArea");
    const status=document.getElementById("gameStatus");

    let score=0;
    let time=20;
    let running=true;

    const target=document.createElement("button");

    target.className="target";

    area.appendChild(target);

    function move(){

        const maxX=Math.max(
            0,
            area.clientWidth-45
        );

        const maxY=Math.max(
            0,
            area.clientHeight-45
        );

        target.style.left=
            Math.random()*maxX+"px";

        target.style.top=
            Math.random()*maxY+"px";
    }

    target.onclick=()=>{

        if(!running) return;

        score++;

        move();

        status.textContent=
            `남은 시간: ${time}초 · 점수: ${score}`;
    };

    move();

    const interval=setInterval(()=>{

        time--;

        status.textContent=
            `남은 시간: ${time}초 · 점수: ${score}`;

        if(time<=0){

            running=false;

            clearInterval(interval);

            target.remove();

            const isRecord=record("target",score);

            status.textContent=
                `종료 · ${score}점`+
                (isRecord?" · 신기록!":"");
        }

    },1000);

    gameIntervals.push(interval);
}

/* =========================================================
   REACTION
========================================================= */

function initReaction(){

    const area=document.getElementById("gameArea");
    const status=document.getElementById("gameStatus");

    const box=document.createElement("div");

    box.className="reaction-box wait";
    box.textContent="기다리세요...";

    area.appendChild(box);

    let started=false;
    let finished=false;
    let startTime=0;

    const delay=1200+Math.random()*3000;

    const timer=setTimeout(()=>{

        if(finished) return;

        started=true;
        startTime=performance.now();

        box.className="reaction-box ready";
        box.textContent="지금! 클릭!";

    },delay);

    gameTimers.push(timer);

    box.onclick=()=>{

        if(finished) return;

        if(!started){

            finished=true;

            clearTimeout(timer);

            box.textContent="너무 빨랐어요!";
            status.textContent="실패 · 재시작해서 다시 도전하세요.";

            return;
        }

        finished=true;

        const reaction=Math.round(
            performance.now()-startTime
        );

        const isRecord=record(
            "reaction",
            reaction,
            true
        );

        box.textContent=reaction+" ms";

        status.textContent=
            `반응속도: ${reaction} ms`+
            (isRecord?" · 신기록!":"");
    };
}

/* =========================================================
   MEMORY
========================================================= */

function initMemory(){

    const area=document.getElementById("gameArea");
    const status=document.getElementById("gameStatus");

    let number=String(
        Math.floor(10000+Math.random()*90000)
    );

    let time=3;

    area.innerHTML=`
        <div class="memory-number">
            ${number}
        </div>
    `;

    status.textContent=
        `숫자를 기억하세요 · ${time}초`;

    const interval=setInterval(()=>{

        time--;

        if(time<=0){

            clearInterval(interval);

            area.innerHTML=`
                <div class="math-box">

                    <div class="muted">
                        방금 본 숫자를 입력하세요
                    </div>

                    <input
                        id="memoryAnswer"
                        class="math-answer"
                        inputmode="numeric"
                        autocomplete="off"
                    >

                    <button class="action primary"
                        onclick="checkMemory('${number}')">
                        확인
                    </button>

                </div>
            `;

            document.getElementById("memoryAnswer").focus();

        }else{

            status.textContent=
                `숫자를 기억하세요 · ${time}초`;
        }

    },1000);

    gameIntervals.push(interval);
}

function checkMemory(answer){

    const input=document.getElementById("memoryAnswer");
    const status=document.getElementById("gameStatus");

    if(!input) return;

    const value=input.value.trim();

    if(value===answer){

        const score=answer.length;

        const isRecord=record("memory",score);

        status.textContent=
            `정답! ${score}자리 기억 성공`+
            (isRecord?" · 신기록!":"");

    }else{

        status.textContent=
            `오답 · 정답은 ${answer}`;
    }
}

/* =========================================================
   MATH SPEED
========================================================= */

function initMath(){

    const area=document.getElementById("gameArea");
    const status=document.getElementById("gameStatus");

    let score=0;
    let time=30;
    let a,b,answer;

    area.innerHTML=`
        <div class="math-box">

            <div id="mathQuestion"
                class="math-question">
            </div>

            <input
                id="mathAnswer"
                class="math-answer"
                inputmode="numeric"
                autocomplete="off"
                placeholder="정답"
            >

            <button
                id="mathSubmit"
                class="action primary">
                확인
            </button>

        </div>
    `;

    const input=document.getElementById("mathAnswer");
    const button=document.getElementById("mathSubmit");
    const question=document.getElementById("mathQuestion");

    function newQuestion(){

        a=Math.floor(Math.random()*20)+1;
        b=Math.floor(Math.random()*20)+1;

        const ops=["+","-","×"];
        const op=ops[Math.floor(Math.random()*ops.length)];

        if(op==="+") answer=a+b;
        if(op==="-") answer=a-b;
        if(op==="×") answer=a*b;

        question.textContent=
            `${a} ${op} ${b} = ?`;

        input.value="";
        input.focus();
    }

    function submit(){

        if(time<=0) return;

        const value=Number(input.value);

        if(value===answer){
            score++;
        }

        status.textContent=
            `남은 시간: ${time}초 · 점수: ${score}`;

        newQuestion();
    }

    button.onclick=submit;

    input.addEventListener("keydown",e=>{
        if(e.key==="Enter") submit();
    });

    newQuestion();

    status.textContent=
        `남은 시간: ${time}초 · 점수: ${score}`;

    const interval=setInterval(()=>{

        time--;

        status.textContent=
            `남은 시간: ${time}초 · 점수: ${score}`;

        if(time<=0){

            clearInterval(interval);

            input.disabled=true;
            button.disabled=true;

            const isRecord=record("math",score);

            status.textContent=
                `종료 · ${score}문제 정답`+
                (isRecord?" · 신기록!":"");
        }

    },1000);

    gameIntervals.push(interval);
}

/* =========================================================
   KEYBOARD SHORTCUT
========================================================= */

document.addEventListener("keydown",e=>{

    if(e.key==="Escape"){

        closeLaunchpad();
        hideContext();
    }

    if(
        (e.ctrlKey||e.metaKey) &&
        e.key.toLowerCase()==="space"
    ){

        e.preventDefault();
        toggleLaunchpad();
    }
});

========================================================= */

document.addEventListener("touchstart",()=>{},{
    passive:true
});
