<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>NovaOS</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

:root{
  --accent:#007aff;
  --glass:rgba(245,245,247,.72);
  --glass-dark:rgba(30,30,32,.72);
  --text:#111;
  --muted:#777;
}

html,body{
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",
    "Helvetica Neue","Noto Sans KR",Arial,sans-serif;
}

body{
  background:#111;
}

/* =========================
   DESKTOP
========================= */

#desktop{
  position:fixed;
  inset:0;
  overflow:hidden;

  background:
    radial-gradient(circle at 20% 15%,rgba(255,255,255,.35),transparent 25%),
    radial-gradient(circle at 80% 20%,rgba(0,180,255,.35),transparent 30%),
    radial-gradient(circle at 55% 80%,rgba(120,70,255,.3),transparent 35%),
    linear-gradient(135deg,#173b66,#6c4e9c 50%,#0d7d96);

  background-size:cover;
  transition:.5s;
}

#desktop.wall2{
  background:
    radial-gradient(circle at 70% 20%,#ff7b9d55,transparent 30%),
    radial-gradient(circle at 20% 80%,#875eff55,transparent 35%),
    linear-gradient(135deg,#130f2b,#492055,#091b35);
}

#desktop.wall3{
  background:
    radial-gradient(circle at 50% 20%,#00d9ff55,transparent 30%),
    radial-gradient(circle at 20% 70%,#0066ff55,transparent 35%),
    linear-gradient(135deg,#03121e,#064c67,#071426);
}

#desktop.wall4{
  background:
    radial-gradient(circle at 50% 20%,#ffb34755,transparent 30%),
    radial-gradient(circle at 80% 80%,#ff4e4e33,transparent 35%),
    linear-gradient(135deg,#21150c,#542b13,#090b10);
}

/* =========================
   MENU BAR
========================= */

.menu-bar{
  position:absolute;
  top:0;
  left:0;
  right:0;
  height:34px;

  display:flex;
  align-items:center;

  padding:0 13px;

  background:rgba(20,20,22,.5);
  backdrop-filter:blur(22px);
  -webkit-backdrop-filter:blur(22px);

  color:white;

  z-index:10000;

  font-size:13px;
}

.menu-left,
.menu-right{
  display:flex;
  align-items:center;
  gap:16px;
}

.menu-left{
  flex:1;
}

.menu-item{
  opacity:.92;
  cursor:pointer;
  white-space:nowrap;
}

.menu-item:hover{
  opacity:1;
}

.nova-symbol{
  font-weight:800;
  font-size:15px;
}

.menu-title{
  font-weight:700;
}

.menu-right{
  gap:14px;
  font-size:12px;
}

#liveTime{
  font-variant-numeric:tabular-nums;
}

/* =========================
   DESKTOP ICONS
========================= */

.desktop-icons{
  position:absolute;
  top:55px;
  right:22px;

  display:flex;
  flex-direction:column;
  gap:18px;

  width:90px;

  z-index:10;
}

.desktop-icon{
  width:90px;
  padding:7px 3px;

  border:1px solid transparent;
  border-radius:10px;

  background:transparent;
  color:white;

  text-align:center;
  cursor:pointer;
}

.desktop-icon:hover{
  background:rgba(255,255,255,.16);
}

.desktop-icon .folder{
  width:48px;
  height:39px;
  margin:auto;

  position:relative;

  border-radius:6px;

  background:linear-gradient(
    180deg,
    #66c7ff,
    #1678df
  );

  box-shadow:
    0 5px 15px rgba(0,0,0,.25);
}

.desktop-icon .folder:before{
  content:"";
  position:absolute;

  top:-5px;
  left:5px;

  width:20px;
  height:8px;

  border-radius:5px 5px 0 0;

  background:#65baff;
}

.desktop-icon span{
  display:block;
  margin-top:7px;

  font-size:11px;
  line-height:14px;

  text-shadow:0 1px 4px #000;
}

/* =========================
   WINDOWS
========================= */

#windows{
  position:absolute;
  inset:34px 0 0 0;
  pointer-events:none;
}

.window{
  position:absolute;

  width:700px;
  height:470px;

  min-width:300px;
  min-height:230px;

  overflow:hidden;

  border-radius:13px;

  background:rgba(245,245,247,.91);

  color:#111;

  box-shadow:
    0 30px 80px rgba(0,0,0,.35),
    0 2px 8px rgba(0,0,0,.15);

  border:1px solid rgba(255,255,255,.55);

  backdrop-filter:blur(30px);
  -webkit-backdrop-filter:blur(30px);

  pointer-events:auto;

  animation:windowOpen .18s ease;
}

@keyframes windowOpen{
  from{
    opacity:0;
    transform:scale(.97);
  }

  to{
    opacity:1;
    transform:scale(1);
  }
}

.window.hidden{
  display:none;
}

.window.maximized{
  left:8px!important;
  top:8px!important;

  width:calc(100% - 16px)!important;
  height:calc(100% - 92px)!important;
}

.titlebar{
  height:43px;

  display:flex;
  align-items:center;

  padding:0 10px;

  background:rgba(245,245,247,.82);

  border-bottom:1px solid rgba(0,0,0,.08);

  cursor:grab;
}

.titlebar:active{
  cursor:grabbing;
}

.traffic{
  display:flex;
  gap:7px;

  width:72px;
}

.traffic button{
  width:12px;
  height:12px;

  border-radius:50%;

  border:0;

  padding:0;

  cursor:pointer;
}

.close-btn{
  background:#ff5f57;
}

.min-btn{
  background:#febc2e;
}

.max-btn{
  background:#28c840;
}

.window-title{
  flex:1;

  text-align:center;

  font-size:12px;
  font-weight:600;

  color:#333;
}

.window-spacer{
  width:72px;
}

.window-content{
  width:100%;
  height:calc(100% - 43px);

  overflow:auto;
}

/* =========================
   FINDER
========================= */

.finder{
  height:100%;

  display:flex;

  background:#f5f5f7;
}

.sidebar{
  width:165px;

  padding:18px 10px;

  background:rgba(235,235,240,.7);

  border-right:1px solid rgba(0,0,0,.08);
}

.sidebar-title{
  padding:0 10px 9px;

  font-size:11px;
  color:#777;
  font-weight:600;
}

.side-btn{
  width:100%;

  padding:8px 10px;

  display:flex;
  align-items:center;
  gap:8px;

  border:0;
  border-radius:7px;

  background:transparent;

  font-size:11px;
  text-align:left;
}

.side-btn:hover,
.side-btn.active{
  background:rgba(0,122,255,.12);
  color:#006bd6;
}

.finder-main{
  flex:1;
  padding:22px;

  overflow:auto;
}

.finder-toolbar{
  display:flex;
  align-items:center;
  gap:8px;

  margin-bottom:20px;
}

.back{
  width:30px;
  height:27px;

  border:0;
  border-radius:7px;

  background:#e5e5e9;

  font-size:15px;
}

.finder-path{
  font-size:13px;
  font-weight:600;
}

.files{
  display:grid;

  grid-template-columns:
    repeat(auto-fill,minmax(105px,1fr));

  gap:12px;
}

.file{
  padding:15px 8px;

  border-radius:10px;

  text-align:center;

  cursor:pointer;
}

.file:hover{
  background:rgba(0,122,255,.1);
}

.file-icon{
  width:50px;
  height:42px;

  margin:auto;

  border-radius:7px;

  display:grid;
  place-items:center;

  font-size:8px;
  font-weight:700;

  color:white;

  background:linear-gradient(
    180deg,
    #6fcaff,
    #1678dc
  );

  box-shadow:
    0 5px 12px rgba(0,0,0,.15);
}

.file-icon.doc{
  background:linear-gradient(
    180deg,
    #8e8e93,
    #4b4b50
  );
}

.file-icon.app{
  border-radius:11px;

  background:linear-gradient(
    135deg,
    #7b68ee,
    #007aff
  );
}

.file-name{
  margin-top:7px;

  font-size:10px;
  color:#333;
}

/* =========================
   NOTES
========================= */

.notes-app{
  height:100%;

  display:flex;
  flex-direction:column;

  padding:15px;

  background:#fff;
}

.notes-toolbar{
  display:flex;
  justify-content:space-between;
  align-items:center;

  padding-bottom:10px;
}

.notes-toolbar b{
  font-size:13px;
}

.notes-status{
  color:#888;
  font-size:10px;
}

#notesArea{
  flex:1;

  width:100%;

  resize:none;

  outline:none;
  border:0;

  padding:15px;

  border-radius:9px;

  background:#f5f5f7;

  font-family:inherit;

  font-size:14px;

  line-height:1.8;

  color:#222;
}

/* =========================
   CALCULATOR
========================= */

.calculator{
  width:330px;
  max-width:100%;

  margin:auto;
  padding:25px;
}

.calc-display{
  height:70px;

  display:flex;
  align-items:flex-end;
  justify-content:flex-end;

  overflow:hidden;

  padding:0 12px 10px;

  font-size:38px;
  font-weight:300;

  font-variant-numeric:tabular-nums;

  color:#111;
}

.calc-grid{
  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  gap:7px;
}

.calc-grid button{
  height:55px;

  border:0;
  border-radius:50%;

  background:#e5e5e7;

  font-size:17px;

  cursor:pointer;
}

.calc-grid button:hover{
  filter:brightness(.94);
}

.calc-grid .operator{
  background:#ff9500;
  color:white;
}

.calc-grid .special{
  background:#d4d4d6;
}

/* =========================
   TERMINAL
========================= */

.terminal{
  height:100%;

  background:#101012;

  color:#e9e9ed;

  padding:18px;

  font-family:
    SFMono-Regular,
    Consolas,
    monospace;

  font-size:12px;

  overflow:auto;
}

.terminal-output{
  white-space:pre-wrap;
  line-height:1.65;
}

.terminal-input-row{
  display:flex;
  gap:8px;
  margin-top:5px;
}

.terminal-prompt{
  color:#35d07f;
}

#terminalInput{
  flex:1;

  border:0;
  outline:0;

  background:transparent;

  color:white;

  font-family:inherit;
}

/* =========================
   BROWSER
========================= */

.browser{
  height:100%;

  display:flex;
  flex-direction:column;

  background:#fff;
}

.browser-toolbar{
  display:flex;
  align-items:center;
  gap:8px;

  padding:9px;

  background:#e8e8eb;

  border-bottom:1px solid #d0d0d3;
}

.browser-circle{
  width:25px;
  height:25px;

  display:grid;
  place-items:center;

  border:0;
  border-radius:50%;

  background:#d0d0d3;

  font-size:12px;
}

.address{
  flex:1;

  height:29px;

  padding:0 12px;

  border:0;
  outline:0;

  border-radius:7px;

  background:#fff;

  font-size:11px;
}

.browser-page{
  flex:1;

  overflow:auto;

  padding:45px;

  background:
    radial-gradient(
      circle at 50% 0%,
      #007aff12,
      transparent 40%
    ),
    #fff;
}

.browser-logo{
  font-size:37px;
  font-weight:800;
  letter-spacing:-2px;
}

.browser-logo span{
  color:#007aff;
}

.browser-card{
  margin-top:30px;

  padding:18px;

  border-radius:12px;

  background:#f5f5f7;

  border:1px solid #e5e5e7;
}

.browser-card b{
  font-size:13px;
}

.browser-card p{
  color:#777;

  font-size:11px;

  line-height:1.7;
}

/* =========================
   SETTINGS
========================= */

.settings{
  padding:25px;

  background:#f5f5f7;

  min-height:100%;
}

.settings h2{
  margin:0 0 18px;

  font-size:22px;
}

.setting-card{
  max-width:600px;

  border-radius:12px;

  overflow:hidden;

  background:white;

  border:1px solid #ddd;
}

.setting-row{
  min-height:65px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:12px 17px;

  border-bottom:1px solid #eee;
}

.setting-row:last-child{
  border-bottom:0;
}

.setting-row b{
  display:block;

  font-size:12px;
}

.setting-row small{
  display:block;

  margin-top:4px;

  color:#888;

  font-size:10px;
}

.wallpapers{
  display:flex;
  gap:7px;
}

.wall{
  width:42px;
  height:32px;

  border:2px solid transparent;
  border-radius:7px;

  cursor:pointer;
}

.wall:hover{
  border-color:#007aff;
}

.wall.a{
  background:linear-gradient(135deg,#173b66,#6c4e9c,#0d7d96);
}

.wall.b{
  background:linear-gradient(135deg,#130f2b,#492055,#091b35);
}

.wall.c{
  background:linear-gradient(135deg,#03121e,#064c67,#071426);
}

.wall.d{
  background:linear-gradient(135deg,#21150c,#542b13,#090b10);
}

#accentPicker{
  width:40px;
  height:30px;

  border:0;
  padding:0;

  background:none;
}

/* =========================
   LAUNCHPAD
========================= */

.launchpad{
  position:absolute;

  inset:34px 0 0 0;

  z-index:8000;

  display:none;

  padding:60px 30px;

  background:
    rgba(30,30,40,.58);

  backdrop-filter:blur(30px);
  -webkit-backdrop-filter:blur(30px);

  animation:launch .2s ease;
}

.launchpad.open{
  display:block;
}

@keyframes launch{
  from{
    opacity:0;
    transform:scale(1.02);
  }

  to{
    opacity:1;
    transform:scale(1);
  }
}

.launch-title{
  text-align:center;

  margin-bottom:35px;

  color:white;

  font-size:22px;
  font-weight:700;
}

.launch-grid{
  max-width:650px;

  margin:auto;

  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  gap:30px;
}

.launch-app{
  border:0;
  background:none;

  color:white;

  text-align:center;

  cursor:pointer;
}

.launch-icon{
  width:68px;
  height:68px;

  margin:auto;

  display:grid;
  place-items:center;

  border-radius:17px;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.8),
      rgba(255,255,255,.3)
    );

  color:#333;

  font-size:10px;
  font-weight:800;

  box-shadow:
    0 10px 30px rgba(0,0,0,.25);

  transition:.15s;
}

.launch-app:hover .launch-icon{
  transform:scale(1.08);
}

.launch-app span{
  display:block;

  margin-top:9px;

  font-size:11px;

  text-shadow:0 2px 5px #000;
}

/* =========================
   DOCK
========================= */

.dock-wrap{
  position:absolute;

  left:50%;
  bottom:12px;

  transform:translateX(-50%);

  z-index:9000;
}

.dock{
  display:flex;
  align-items:flex-end;

  gap:8px;

  padding:8px 10px;

  border-radius:20px;

  background:rgba(245,245,247,.43);

  border:1px solid rgba(255,255,255,.45);

  backdrop-filter:blur(25px);
  -webkit-backdrop-filter:blur(25px);

  box-shadow:
    0 15px 45px rgba(0,0,0,.25);
}

.dock-app{
  width:52px;
  height:52px;

  display:grid;
  place-items:center;

  border:0;
  border-radius:14px;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.9),
      rgba(220,220,225,.65)
    );

  color:#222;

  font-size:9px;
  font-weight:800;

  cursor:pointer;

  box-shadow:
    0 4px 10px rgba(0,0,0,.15);

  transition:
    transform .14s,
    margin .14s;
}

.dock-app:hover{
  transform:
    translateY(-10px)
    scale(1.18);
  margin:0 5px;
}

.dock-app.blue{
  background:linear-gradient(135deg,#63c5ff,#007aff);
  color:white;
}

.dock-app.green{
  background:linear-gradient(135deg,#5ee890,#16a85a);
  color:white;
}

.dock-app.purple{
  background:linear-gradient(135deg,#b083ff,#6c4cff);
  color:white;
}

.dock-app.dark{
  background:linear-gradient(135deg,#45454a,#111114);
  color:white;
}

.dock-separator{
  width:1px;
  height:40px;

  background:rgba(255,255,255,.5);

  margin:0 2px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px){

  .menu-left .hide-mobile{
    display:none;
  }

  .menu-right{
    gap:8px;
  }

  .menu-right .hide-mobile{
    display:none;
  }

  .desktop-icons{
    left:12px;
    right:auto;

    flex-direction:row;
    flex-wrap:wrap;

    width:250px;

    gap:12px;
  }

  .desktop-icon{
    width:70px;
  }

  .window{
    left:7px!important;
    top:42px!important;

    width:calc(100% - 14px)!important;
    height:calc(100% - 115px)!important;

    min-width:0;
  }

  .sidebar{
    display:none;
  }

  .finder-main{
    padding:15px;
  }

  .launch-grid{
    grid-template-columns:
      repeat(3,1fr);

    gap:25px 10px;
  }

  .dock{
    max-width:
      calc(100vw - 14px);

    overflow-x:auto;
  }

  .dock-app{
    flex:none;

    width:46px;
    height:46px;
  }

  .browser-page{
    padding:25px;
  }
}
</style>
</head>

<body>

<div id="desktop">

  <!-- =====================
       MENU BAR
  ====================== -->

  <div class="menu-bar">

    <div class="menu-left">

      <div class="menu-item nova-symbol">
        N
      </div>

      <div
        class="menu-item menu-title"
        onclick="openAbout()"
      >
        NovaOS
      </div>

      <div
        class="menu-item hide-mobile"
        onclick="openFinder()"
      >
        파일
      </div>

      <div
        class="menu-item hide-mobile"
        onclick="openNotes()"
      >
        편집
      </div>

      <div
        class="menu-item hide-mobile"
        onclick="openSettings()"
      >
        보기
      </div>

    </div>

    <div class="menu-right">

      <div class="menu-item hide-mobile">
        Wi-Fi
      </div>

      <div class="menu-item">
        배터리 100%
      </div>

      <div
        id="liveTime"
        class="menu-item"
      >
        00:00
      </div>

    </div>

  </div>


  <!-- =====================
       DESKTOP ICONS
  ====================== -->

  <div class="desktop-icons">

    <button
      class="desktop-icon"
      ondblclick="openFinder()"
    >
      <div class="folder"></div>
      <span>파일</span>
    </button>

    <button
      class="desktop-icon"
      ondblclick="openNotes()"
    >
      <div class="folder"></div>
      <span>문서</span>
    </button>

  </div>


  <!-- =====================
       WINDOWS
  ====================== -->

  <div id="windows"></div>


  <!-- =====================
       LAUNCHPAD
  ====================== -->

  <div
    id="launchpad"
    class="launchpad"
    onclick="launchBackground(event)"
  >

    <div class="launch-title">
      앱
    </div>

    <div class="launch-grid">

      <button
        class="launch-app"
        onclick="openFinder()"
      >
        <div class="launch-icon">
          FINDER
        </div>
        <span>파일</span>
      </button>

      <button
        class="launch-app"
        onclick="openNotes()"
      >
        <div class="launch-icon">
          NOTE
        </div>
        <span>메모</span>
      </button>

      <button
        class="launch-app"
        onclick="openCalculator()"
      >
        <div class="launch-icon">
          CALC
        </div>
        <span>계산기</span>
      </button>

      <button
        class="launch-app"
        onclick="openTerminal()"
      >
        <div class="launch-icon">
          TERM
        </div>
        <span>터미널</span>
      </button>

      <button
        class="launch-app"
        onclick="openBrowser()"
      >
        <div class="launch-icon">
          WEB
        </div>
        <span>브라우저</span>
      </button>

      <button
        class="launch-app"
        onclick="openSettings()"
      >
        <div class="launch-icon">
          SET
        </div>
        <span>설정</span>
      </button>

      <button
        class="launch-app"
        onclick="openAbout()"
      >
        <div class="launch-icon">
          NOVA
        </div>
        <span>NovaOS</span>
      </button>

    </div>

  </div>


  <!-- =====================
       DOCK
  ====================== -->

  <div class="dock-wrap">

    <div class="dock">

      <button
        class="dock-app blue"
        onclick="toggleLaunchpad()"
        title="Launchpad"
      >
        APPS
      </button>

      <button
        class="dock-app"
        onclick="openFinder()"
        title="Finder"
      >
        FINDER
      </button>

      <button
        class="dock-app blue"
        onclick="openBrowser()"
        title="Browser"
      >
        WEB
      </button>

      <button
        class="dock-app green"

function openApp(type,title){

  if(windows[type]){

    const win=windows[type];

    win.classList.remove("hidden");

    bringToFront(win);

    return;

  }

  const win=
    document.createElement("div");

  win.className="window";

  win.style.zIndex=++zIndex;

  const offset=
    (windowOffset++%5)*25;

  win.style.left=
    `calc(50% - 350px + ${offset}px)`;

  win.style.top=
    `calc(50% - 235px + ${offset}px)`;

  win.innerHTML=`

    <div
      class="titlebar"
      data-drag
    >

      <div class="traffic">

        <button
          class="close-btn"
          onclick="closeApp('${type}')"
        ></button>

        <button
          class="min-btn"
          onclick="minimizeApp('${type}')"
        ></button>

        <button
          class="max-btn"
          onclick="maximizeApp('${type}')"
        ></button>

      </div>

      <div class="window-title">
        ${title}
      </div>

      <div class="window-spacer"></div>

    </div>

    <div class="window-content">
      ${getAppContent(type)}
    </div>

  `;

  document
    .getElementById("windows")
    .appendChild(win);

  windows[type]=win;

  makeDraggable(win);

  initializeApp(type);

  bringToFront(win);

}


function closeApp(type){

  if(!windows[type])
    return;

  windows[type].remove();

  delete windows[type];

}


function minimizeApp(type){

function maximizeApp(type){

    windows[type].classList.toggle("maximized");

}


function bringToFront(win){

  win.style.zIndex=++zIndex;

}


/* =====================================================
   DRAG
===================================================== */

function makeDraggable(win){

  const bar=
    win.querySelector("[data-drag]");

  let dragging=false;
  let offsetX=0;
  let offsetY=0;

  bar.addEventListener(
    "mousedown",
    function(e){

      if(e.target.tagName==="BUTTON")
        return;

      if(win.classList.contains("maximized"))
        return;

      dragging=true;

      const rect=
        win.getBoundingClientRect();

      offsetX=
        e.clientX-rect.left;

      offsetY=
        e.clientY-rect.top;

      bringToFront(win);

    }
  );

  document.addEventListener(
    "mousemove",
    function(e){

      if(!dragging)
        return;

      let x=
        e.clientX-offsetX;

      let y=
        e.clientY-offsetY;

      const maxX=
        window.innerWidth-win.offsetWidth;

      const maxY=
        window.innerHeight-win.offsetHeight-70;

      x=Math.max(0,Math.min(maxX,x));
      y=Math.max(34,Math.min(maxY,y));

      win.style.left=x+"px";
      win.style.top=y+"px";

    }
  );

  document.addEventListener(
    "mouseup",
    function(){
      dragging=false;
    }
  );

}

          input.value="";

        }

      }
    );

/* =====================================================
   CALCULATOR
===================================================== */

let calcValue="0";

function calcDisplay(){

  const el=
    document.getElementById(
      "calcDisplay"
    );

  if(el)
    el.textContent=calcValue;

}

function calcInput(value){

  if(calcValue==="ERROR")
    calcValue="0";

  if(
    calcValue==="0" &&
    ![".","+","-","*","/","%"]
      .includes(value)
  ){

    calcValue=value;

  }else{

    calcValue+=value;

  }

  calcDisplay();

}


function calcClear(){

  calcValue="0";

  calcDisplay();

}


function calcDelete(){

  if(calcValue==="ERROR"){

    calcValue="0";

  }else{

    calcValue=
      calcValue.length>1
      ? calcValue.slice(0,-1)
      : "0";

  }

  calcDisplay();

}


function calcEqual(){

  try{

    if(
      !/^[0-9+\-*/%.() ]+$/
        .test(calcValue)
    )
      throw new Error();

    const result=
      Function(
        "return ("+
        calcValue+
        ")"
      )();

    if(!Number.isFinite(result))
      throw new Error();

    calcValue=
      String(
        Math.round(
          result*100000000
        )/100000000
      );

  }catch(e){

    calcValue="ERROR";

  }

  calcDisplay();

}


/* =====================================================
   TERMINAL
===================================================== */

function terminalCommand(command){

  const output=
    document.getElementById(
      "terminalOutput"
    );

  if(!output)
    return;

  const cmd=
    command.trim();

  output.textContent+=
    "nova$ "+cmd+"\n";

  let result="";

  if(cmd===""){

    result="";

  }

  else if(cmd==="help"){

    result=
`help       명령어 목록
clear      화면 지우기
date       현재 날짜
time       현재 시간
whoami     사용자 정보
system     시스템 정보
about      NovaOS 정보
echo       텍스트 출력`;

  }

  else if(cmd==="clear"){

    output.textContent="";
    return;

  }

  else if(cmd==="date"){

    result=
      new Intl.DateTimeFormat(
        "ko-KR",
        {
          timeZone:"Asia/Seoul",
          dateStyle:"full"
        }
      ).format(
        new Date()
      );

  }

  else if(cmd==="time"){

    result=
      new Intl.DateTimeFormat(
        "ko-KR",
        {
          timeZone:"Asia/Seoul",
          timeStyle:"medium"
        }
      ).format(
        new Date()
      );

  }

  else if(cmd==="whoami"){

    result="nova-user";

  }

  else if(cmd==="system"){

    result=
`NovaOS Web Edition
Browser: ${navigator.userAgent}
Language: ${navigator.language}
Platform: ${navigator.platform}`;

  }

  else if(cmd==="about"){

    result=
`NovaOS
Web Edition 1.0
HTML / CSS / JavaScript`;

  }

  else if(
    cmd.toLowerCase().startsWith("echo ")
  ){

    result=
      cmd.substring(5);

  }

  else{

    result=
      "command not found: "+cmd;

  }

  output.textContent+=
    result+"\n\n";

  const terminal=
    document.querySelector(".terminal");

  if(terminal)
    terminal.scrollTop=
      terminal.scrollHeight;

}

   BROWSER

      "browserAddress"

  }

  page.innerHTML=`

      <b>
        ${safe}

      <b>NovaWeb</b>

      <p>
        실제 인터넷 사이트를 불러오는
        브라우저가 아닌 OS 시뮬레이션입니다.

function escapeHTML(text){

  return text
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

===================================================== */

function setWallpaper(num){

  const desktop=
    document.getElementById(
      "desktop"
    );

  desktop.classList.remove(
    "wall2",
    "wall3",
    "wall4"
  );

  if(num===2)
    desktop.classList.add("wall2");

  if(num===3)
    desktop.classList.add("wall3");

  if(num===4)
    desktop.classList.add("wall4");

  saved.wallpaper=num;

  save();

===================================================== */
